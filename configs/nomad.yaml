services:
  api_host: "141.20.184.181"
  api_base_path: "/backend"

oasis:
  is_oasis: true
  uses_central_user_management: true
  require_authentication: true
  allowed_users:
    - siamak.nakhaie@physik.hu-berlin.de

north:
  enabled: false

meta:
  deployment: "oasis"
  deployment_url: "http://141.20.184.181/api"
  maintainer_email: "siamak.nakhaie@physik.hu-berlin.de"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

plugins:
  entry_points:
    options:
      nomad_oasis_customizer_toolkit.schema_packages:schema_visibility:
        # Only these schemas are offered when creating a new entry in the GUI.
        allowed_schemas:
          - TrainingResource
          - Event Participation Request
          - FAIRmat PI Onboarding
          - FAIRmat Member
          - FAIRmat Event
