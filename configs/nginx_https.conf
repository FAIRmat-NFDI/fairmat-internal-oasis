# Nginx configuration for handling HTTPS requests
# - Redirects all HTTP traffic to HTTPS
# - Uses a self-signed SSL certificate

include conf.d/nginx_maps_conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Redirect all to HTTPS
server {
    listen 80;
    server_name fairmat-oasis.physik.hu-berlin.de;

    location /.well-known/acme-challenge/ {
	    allow all;
	    root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fairmat-oasis.physik.hu-berlin.de;

    # SSL configuration
    #  ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    # ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_certificate     /etc/nginx/ssl/live/fairmat-oasis.physik.hu-berlin.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/fairmat-oasis.physik.hu-berlin.de/privkey.pem;

    proxy_set_header Host $host;

    # Reuse upstream keep-alive connections
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    include conf.d/nginx_base_conf;
}
