# Nginx configuration for handling HTTP requests

include conf.d/nginx_maps_conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen        80;
    server_name   fairmat-oasis.physik.hu-berlin.de;
    proxy_set_header Host $host;

    # Allow certbot ACME challenge through
    location /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    # Reuse upstream keep-alive connections
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    include conf.d/nginx_base_conf;
}
