[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[parsing, infrastructure]>=1.4.1rc1",
  "setuptools",
]


[project.urls]
repository = "https://github.com/fairmat-nfdi/fairmat-internal-oasis"

[project.optional-dependencies]
plugins = [
  "nomad-parser-plugins-electronic>=1.0",
  "FAIRmat-events-form @ git+https://github.com/siamakn/events_form_plugin.git@dd8dd1296ac9708f34cd90e93a186d26731e65ca",
  "nomad-training-resources @ git+https://github.com/siamakn/nomad-training-resources.git@3e8a2e430e1094496864345c51d060f07d98388d",
]
jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[parsing, infrastructure, dev]>=1.4.1rc1"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
